name: DB Fahrplan Alert

on:
  schedule:
    # GitHub Actions schedules run in UTC. These entries cover both CET and CEST;
    # the "Check local alert window" step below keeps the effective schedule in Berlin time.
    - cron: "7,37 6-20 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch:

concurrency:
  group: db-fahrplan-alert
  cancel-in-progress: false

jobs:
  run-alert:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT: ${{ secrets.TELEGRAM_BOT }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_API: ${{ secrets.DB_API }}
      ALERT_STATE_FILE: .cache/alert_state.rds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: .cache
          key: db-alert-state-${{ github.run_id }}
          restore-keys: |
            db-alert-state-

      - name: Check local alert window
        id: alert-window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_alert=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          berlin_time="$(TZ=Europe/Berlin date +%H%M)"
          berlin_hour="${berlin_time%??}"
          berlin_minute="${berlin_time#??}"

          if { [ "$berlin_hour" -ge 8 ] && [ "$berlin_hour" -le 21 ] && { [ "$berlin_minute" = "07" ] || [ "$berlin_minute" = "37" ]; }; } || [ "$berlin_time" = "2207" ]; then
            echo "run_alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_alert=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outside Berlin alert window: $berlin_time"
          fi

      - name: Enable r2u (binary CRAN packages)
        if: steps.alert-window.outputs.run_alert == 'true'
        run: |
          sudo bash -c 'echo "deb [signed-by=/usr/share/keyrings/cran-archive-keyring.gpg] \
          https://r2u.rstudio.com/ubuntu jammy/main/" > /etc/apt/sources.list.d/cran-r2u.list'
          curl -fsSL https://r2u.rstudio.com/ubuntu/cran-archive-keyring.gpg | \
            sudo tee /usr/share/keyrings/cran-archive-keyring.gpg > /dev/null

          sudo apt-get update

      - name: Install R + binary R packages from r2u
        if: steps.alert-window.outputs.run_alert == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            r-base \
            r-cran-shiny \
            r-cran-dplyr \
            r-cran-lubridate \
            r-cran-httr \
            r-cran-xml2 \
            r-cran-purrr \
            r-cran-stringr \
            r-cran-tibble

      - name: Run DB Fahrplan Alert
        if: steps.alert-window.outputs.run_alert == 'true'
        run: |
          Rscript app.R
